# Railway / Nixpacks build configuration.
# INSTALL_CMD overrides the Node.js provider's default (npm ci) so that
# platform-specific lockfile drift (Windows → Linux wasm32 deps) never
# breaks deploys.  [phases.install].cmds only appends — it doesn't replace.
[variables]
INSTALL_CMD = "npm install --no-audit --no-fund"

# ffmpeg — Catalogue Motion's compose worker (worker/index.ts) and QA Stage 1
# (lib/catalogue-motion/workers/qa.ts) both shell out to ffmpeg/ffprobe. Added
# as a Nix package rather than an npm dependency (fluent-ffmpeg etc. still
# need the actual binary present) — same "no new infra, reuse what's already
# provisionable" reasoning as pg-boss over Redis in Phase 1.
[phases.setup]
nixPkgs = ["ffmpeg"]

[phases.build]
cmds = ["npm run build"]

[start]
# db:seed:hm (2026-09-13) — root-caused a real production bug: the
# Home Material domain's HmMaterial/HmProduct/HmRetailer tables were
# never seeded here, so every "select a material type" dropdown in that
# domain (and the browse page, and lead capture) was silently empty in
# production despite working locally. All three scripts it runs
# (seed-material-knowledge.ts, seed-home-material.ts, seed-retailers.ts)
# are upsert-on-deterministic-id, same as the existing db:seed step —
# safe to run on every deploy, not just the first.
cmd = "npm run db:deploy && npm run db:seed && npm run db:seed:hm && npm run start"
