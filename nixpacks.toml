# Railway / Nixpacks build configuration.
# Use npm install (not npm ci) to handle Windows→Linux lockfile drift
# for platform-specific native packages (tailwindcss-oxide, emnapi, etc).
[phases.install]
cmds = ["npm install --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run db:deploy && npm run db:seed && npm run start"
