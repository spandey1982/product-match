# Railway / Nixpacks build configuration.
# INSTALL_CMD overrides the Node.js provider's default (npm ci) so that
# platform-specific lockfile drift (Windows → Linux wasm32 deps) never
# breaks deploys.  [phases.install].cmds only appends — it doesn't replace.
[variables]
INSTALL_CMD = "npm install --no-audit --no-fund"

# ffmpeg — Catalogue Motion's compose worker (worker/index.ts) and QA Stage 1
# (lib/catalogue-motion/workers/qa.ts) both shell out to ffmpeg/ffprobe. Added
# as a Nix package rather than an npm dependency (fluent-ffmpeg etc. still
# need the actual binary present) — same "no new infra, reuse what's already
# provisionable" reasoning as pg-boss over Redis in Phase 1.
[phases.setup]
nixPkgs = ["ffmpeg"]

[phases.build]
cmds = ["npm run build"]

[start]
# 2026-09-12 finding: on this Railway service, [start].cmd here has NO
# effect — confirmed via the actual deploy log, which showed the
# container running package.json's "start" script verbatim
# ("prisma migrate deploy && next start"), completely ignoring whatever
# is set below. Root cause not confirmed (Railpack vs. Nixpacks builder
# selection is the leading theory), but the practical fix is: startup
# behavior for this service is controlled by package.json's "start"
# script, not this file. That's where db:seed / db:seed:hm now live
# (added 2026-09-13 to fix HmMaterial/HmProduct/HmRetailer being empty
# in production — see git history for the original rationale). Left
# here only so the intent isn't lost if Railway's behavior ever changes;
# do not rely on this section actually running.
cmd = "npm run db:deploy && npm run db:seed && npm run db:seed:hm && npm run start"
